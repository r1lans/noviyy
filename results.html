    <script>
        (async function () {
            var grid = document.getElementById('results-grid');
            var filters = document.getElementById('results-filters');
            var all = [];

            function empty(msg) {
                grid.innerHTML = '<div class="empty-state"><strong>Результаты скоро появятся</strong>' + StarthResults.esc(msg || 'Мы добавляем сертификаты наших учеников — загляните позже.') + '</div>';
                filters.hidden = true;
            }
            function show(exam) {
                var list = exam ? all.filter(function (r) { return r.exam === exam; }) : all;
                StarthResults.mount(grid, list);
                filters.querySelectorAll('.filter-btn').forEach(function (b) {
                    b.classList.toggle('active', (b.dataset.exam || '') === (exam || ''));
                });
            }

            if (typeof FIREBASE_READY === 'undefined' || !FIREBASE_READY) { empty(); return; }
            try {
                var snap = await db.collection('results').get();
                snap.forEach(function (d) { all.push(d.data()); });
                // newest first (sorted here so no Firestore index is needed)
                all.sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
                if (!all.length) { empty(); return; }
                (function stats() {
                    var ielts = all.filter(function (r) { return String(r.exam || '').toUpperCase().indexOf('IELTS') !== -1 && parseFloat(r.overall) > 0; });
                    var box = document.getElementById('results-stats');
                    var items = [[all.length, 'сертификатов']];
                    if (ielts.length) {
                        var best = Math.max.apply(null, ielts.map(function (r) { return parseFloat(r.overall); }));
                        var hi = ielts.filter(function (r) { return parseFloat(r.overall) >= 7; }).length;
                        items.push([best.toFixed(1), 'лучший IELTS']); items.push([Math.round(hi / ielts.length * 100) + '%', 'IELTS от 7.0']);
                    }
                    box.innerHTML = items.map(function (i) { return '<div><b>' + i[0] + '</b><span>' + i[1] + '</span></div>'; }).join('');
                    box.hidden = false;
                })();

                var exams = [];
                all.forEach(function (r) { if (r.exam && exams.indexOf(r.exam) === -1) exams.push(r.exam); });
                if (exams.length > 1) {
                    filters.innerHTML = '<button type="button" class="filter-btn active" data-exam="">Все</button>' +
                        exams.map(function (e) { return '<button type="button" class="filter-btn" data-exam="' + StarthResults.esc(e) + '">' + StarthResults.esc(e) + '</button>'; }).join('');
                    filters.hidden = false;
                    filters.addEventListener('click', function (e) {
                        var b = e.target.closest('.filter-btn');
                        if (b) show(b.dataset.exam || '');
                    });
                }
                show('');
            } catch (err) {
                console.warn('Results failed to load', err);
                empty('Не удалось загрузить результаты. Обновите страницу чуть позже.');
            }
        })();
    </script>

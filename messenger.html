<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js"></script>
    <script src="sheets-config.js"></script>
    <title>Мессенджер — TheStarth</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body.msg-body { overflow-x: hidden; }
        .msg-wrap { max-width: 1280px; margin: 0 auto; padding: 104px 1rem 1rem; }
        .msg-wrap h1 { font-size: 1.5rem; margin: 0 0 .8rem; }
        #messengerSection[data-page="1"] .msg { height: calc(100dvh - 190px); min-height: 460px; grid-template-columns: 380px minmax(0, 1fr); margin-bottom: 0; }
        .msg-login { text-align: center; padding: 4rem 1rem; }
        @media (max-width: 720px) { .msg-wrap { padding: 84px .5rem .6rem; } .msg-wrap h1 { display: none; } #messengerSection[data-page="1"] .msg { height: calc(100dvh - 100px); grid-template-columns: 1fr; } }
    </style>
</head>
<body class="msg-body">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" style="text-decoration: none;">
                <div class="logo" style="display: flex; align-items: center; gap: 12px; letter-spacing: normal;">
                    <img class="site-logo-full" src="images/logo-full.png" alt="TheStarth — Start with the best." style="height:53px;width:auto;object-fit:contain;display:block;">
                </div>
            </a>
            <button class="mobile-toggle" aria-label="Toggle menu"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.15em;flex-shrink:0;"><path d="M4 6.5h16"/><path d="M4 12h16"/><path d="M4 17.5h16"/></svg></button>
            <div class="nav-links">
                <a href="index.html#courses" data-i18n="nav.courses">Курсы</a>
                <a href="results.html" data-i18n="nav.results">Результаты</a>
                <a href="about.html" data-i18n="nav.about">О нас</a>
                <a href="news.html" data-i18n="nav.news">Новости</a>
                <a href="mock-exam.html" style="color: var(--accent); font-weight: bold; position: relative;">Mock Exam <span style="position: absolute; top: -12px; right: -15px; background: red; color: white; font-size: 0.55rem; padding: 2px 4px; border-radius: 4px; text-transform: uppercase;">New</span></a>
                <a href="payment.html" class="btn-outline" style="border-color: var(--accent); color: var(--accent);" data-i18n="nav.payment">Оплата</a>
                <a href="dashboard.html" class="btn-outline" data-i18n="nav.dashboard">Личный кабинет</a>
                <div class="lang-switch">
                    <a href="#" onclick="changeLanguage('ru'); return false;" class="lang-btn active">RU</a>
                    <a href="#" onclick="changeLanguage('uz'); return false;" class="lang-btn">UZ</a>
                    <a href="#" onclick="changeLanguage('en'); return false;" class="lang-btn">EN</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="msg-wrap">
        <h1>Мессенджер</h1>
        <div class="msg-login" id="msgLogin" style="display:none;">
            <p>Войдите в аккаунт, чтобы писать сообщения.</p>
            <a class="btn-primary" style="display:inline-block;padding:.8rem 1.6rem;border-radius:10px;" href="index.html#login">Войти</a>
        </div>
        <div id="messengerSection" data-page="1"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-nav.js"></script>
    <script src="translations.js"></script>
    <script src="content-i18n.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="i18n-extra.js"></script>
    <script src="messenger.js"></script>
    <script>
        (function () {
            var sec = document.getElementById('messengerSection'), login = document.getElementById('msgLogin');
            function say(html) { sec.innerHTML = '<div class="msg-login">' + html + '</div>'; }
            window.addEventListener('error', function (e) { if (sec && !sec.querySelector('.msg')) say('Не удалось загрузить мессенджер: ' + (e.message || 'ошибка') + '. Обновите страницу (Ctrl+F5).'); });
            say('Загрузка…');
            if (typeof FIREBASE_READY === 'undefined' || !FIREBASE_READY || typeof auth === 'undefined') { say('Сайт ещё не подключён к Firebase.'); return; }
            var started = '';
            auth.onAuthStateChanged(async function (user) {
                if (!user) { started = ''; sec.innerHTML = ''; login.style.display = 'block'; return; }
                login.style.display = 'none';
                if (started === user.uid) return;
                started = user.uid;
                var profile = window.currentUserProfile;
                if (!profile || !profile.nickname) {
                    try { var d = await db.collection('users').doc(user.uid).get(); profile = d.exists ? d.data() : {}; }
                    catch (err) { say('Не удалось загрузить профиль: ' + err.message); return; }
                }
                try { window.Messenger.init(user, profile); }
                catch (err) { say('Не удалось открыть мессенджер: ' + err.message); }
            });
        })();
    </script>
    <script src="back-btn.js"></script>
</body>
</html>
